syntax = "proto3";

package election.v1;

option go_package = "github.com/JhonmaSG/SD_Taller1_Coordinacion_y_datos_del_sistema/src/bully-algorithm/election/v1;electionpb";

// ElectionService transporta los mensajes del algoritmo Bully entre nodos.
service ElectionService {
  rpc RequestElection(RequestElectionRequest) returns (RequestElectionResponse);
  rpc AnnounceCoordinator(AnnounceCoordinatorRequest) returns (AnnounceCoordinatorResponse);
  rpc ProcessHeartbeat(ProcessHeartbeatRequest) returns (ProcessHeartbeatResponse);
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);
}

message Node {
  uint64 id = 1;
  string address = 2;
}

message RequestElectionRequest {
  Node sender = 1;
}

message RequestElectionResponse {
  bool acknowledged = 1;
}

message AnnounceCoordinatorRequest {
  Node sender = 1;
  Node coordinator = 2;
}

message AnnounceCoordinatorResponse {
  bool accepted = 1;
}

message ProcessHeartbeatRequest {
  Node sender = 1;
  Node coordinator = 2;
}

message ProcessHeartbeatResponse {
  bool alive = 1;
}

message NodeResources {
  int64 cpu_cores = 1;
  int64 memory_gb = 2;
  int64 bandwidth_mbps = 3;
}

message RegisterNodeRequest {
  Node sender = 1;
  NodeResources resources = 2;
}

message RegisterNodeResponse {
  bool accepted = 1;
  NodeDocument document = 2;
}

message NodeDocument {
  Node node = 1;
  string node_role = 2;
  NodeResources resources = 3;
  string status = 4;
}
